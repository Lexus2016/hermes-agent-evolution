name: Nix flake check

# Builds every output of the flake: the package, the devShell, and the 21
# checks under nix/checks.nix — module evaluation, option parity, .env
# assembly, service argv, and the rest.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      commit:
        description: Commit to test and build. Empty keeps the triggering commit.
        type: string
        default: ''
      release:
        description: 'Stable-release candidate run: force the flake-check lane regardless of the classifier.'
        required: false
        type: boolean
        default: false
      version:
        description: 'Release version stamped into an isolated flake source tree.'
        required: false
        type: string
        default: ''


permissions:
  contents: read

  # A `paths:` filter cannot gate this workflow: a push to main must run it
  # whatever changed, because the flake packages the product and nine of the
  # checks run the built binary. The `nix` lane is a slow lane
  # (classify_changes.py): on a pull request it runs for the flake files and
  # the dependency manifests, or the run-e2e label. On push the classifier
  # fails open and every lane is true, so a product change that breaks the
  # flake turns main red after the merge.
  detect:
    name: Detect affected areas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      nix: ${{ steps.classify.outputs.nix }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          # A stable run passes the claim commit. Every other event tests its own head SHA.
          ref: ${{ inputs.commit || github.sha }}

      - name: Detect affected areas
        id: classify
        uses: ./.github/actions/detect-changes
        with:
          github-token: ${{ github.token }}

  flake-check:
    name: nix flake check
    needs: [detect]
    # Release runs force the lane: a stable candidate must build the flake
    # no matter what its diff touches.
    if: needs.detect.outputs.nix == 'true' || inputs.release == true
    # The build compiles the package and its whole dependency closure, so this
    # takes minutes and not seconds when the cache misses. `nix flake check`
    # builds 21 checks, and --max-jobs defaults to the core count. It uses the
    # wider runner with no more configuration.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          # A stable run passes the claim commit. Every other event tests its own head SHA.
          ref: ${{ inputs.commit || github.sha }}

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            fallback = true
            tarball-ttl = 3600

      - name: Restore and save the Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'nix/**', 'pyproject.toml', 'uv.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: ${{ github.event_name != 'pull_request' }}
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Prepare isolated release source
        if: inputs.release == true
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-source"
          git archive "$CANDIDATE_COMMIT" | tar -x -C "$RUNNER_TEMP/release-source"
          python3 scripts/releases/stamping.py --tree "$RUNNER_TEMP/release-source" \
            --version "$RELEASE_VERSION"

      - name: nix flake check
        # --print-build-logs: a check that fails then prints the assertion
        # that failed, and not only the derivation that failed to build.
        # A path: flake has no git metadata, so the release source names its
        # commit with ?rev=: without it self.rev is null, the install stamp
        # carries no commit, and the packaged CLI reports "unknown".
        run: nix flake check "${{ inputs.release == true && format('path:{0}/release-source?rev={1}', runner.temp, env.CANDIDATE_COMMIT) || '.' }}" --print-build-logs

      - name: Verify release package runtime identity
        if: inputs.release == true
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          source="path:$RUNNER_TEMP/release-source?rev=$CANDIDATE_COMMIT"
          package="$(nix build "$source#default" --no-link --print-out-paths)"
          actual="$("$package/bin/hermes" --version)"
          ACTUAL_VERSION="$actual" python3 - <<'PY'
          import os

          expected = os.environ["RELEASE_VERSION"]
          # Line one is "Hermes Agent v<version> (...)"; later lines (Python, OpenAI SDK) carry other versions.
          first = os.environ["ACTUAL_VERSION"].splitlines()[0].split()
          actual = first[2].removeprefix("v") if first[:2] == ["Hermes", "Agent"] and len(first) > 2 else ""
          if actual != expected:
              raise SystemExit(f"Nix package version mismatch: expected {expected}, got {actual}")
          PY
