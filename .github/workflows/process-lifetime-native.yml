name: Process lifetime native validation

# Bounded on-demand proof for the exact process-lifetime candidate.
on:
  push:
    branches: ["security-validation/process-lifetime-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: process-lifetime-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-process:
    name: Process lifetime (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: macos
          - runner: windows-latest
            platform: windows
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git log -1 --format='candidate=%H tree=%T'

      - name: Install locked native test dependencies
        uses: ./.github/actions/setup-pm
        with:
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web"]'
          test-environment: 'true'
          cache: 'false'
          cache-python: 'false'
          cache-node: 'false'

      - name: Execute native ownership and lifetime contracts
        shell: bash
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
          HERMES_TEST_FILE_RETRIES: "0"
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/hermes-process-home"
          export USERPROFILE="$HOME"
          export PROCESS_RESULTS="$RUNNER_TEMP/hermes-process-results"
          mkdir -p "$HOME" "$PROCESS_RESULTS"
          run_file() {
            label="$1"
            file="$2"
            shift 2
            bash scripts/run_tests.sh -j 1 --file-timeout 120 "$file" \
              -- -o addopts= -v --tb=short --timeout=90 \
              --junitxml="$PROCESS_RESULTS/$label.xml" "$@"
          }
          if [ "$NATIVE_PLATFORM" = macos ]; then
            run_file ownership tests/tools/test_local_process_cleanup_ownership.py -k _macos
            run_file lifetime tests/tools/test_local_process_lifetime.py -k _macos
          else
            run_file ownership tests/tools/test_local_process_cleanup_ownership.py -k test_windows_cleanup_preserves_existing_dispatch
            run_file lifetime tests/tools/test_local_process_lifetime.py -k test_windows_retains_native_popen_stdio_and_status
          fi
          if [ "$NATIVE_PLATFORM" = macos ]; then
            run_file registry tests/tools/test_local_registry_lifetime.py -k _macos
            run_file orphan-race tests/tools/test_local_wrapper_exit_ownership.py -k _macos
            run_file interruption tests/tools/test_local_interrupt_cleanup.py \
              -k test_wait_for_process_kills_subprocess_on_keyboardinterrupt
            run_file descendants tests/tools/test_local_setsid_descendant_sweep.py \
              -k test_timeout_kill_reaps_setsid_grandchild
            run_file shutdown tests/tui_gateway/test_serve_exit_flush.py \
              -k test_shutdown_mid_tool_kills_the_command_and_keeps_its_result
          fi
          "$HERMES_PYTHON" - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          folder = Path(os.environ["PROCESS_RESULTS"])
          marker = os.environ["NATIVE_PLATFORM"]
          required = {
              "macos": {
                  "ownership": ["test_unverified_handle_never_discovers_or_signals_macos[",
                                "test_native_owned_process_cleanup_macos[_kill_process-False]",
                                "test_native_owned_process_cleanup_macos[_kill_process-True]",
                                "test_native_owned_process_cleanup_macos[_force_kill_process-False]",
                                "test_native_owned_process_cleanup_macos[_force_kill_process-True]"],
                  "lifetime": [f"test_owned_lifetime_contract_macos[{case}]" for case in
                               ("io_status", "negative_signal", "early_stdin_close", "early_stdout_close",
                                "normal_background", "helper_lost", "failed_yield", "yield_complete",
                                "yield_kill", "parent_eof", "release_wins", "cancel_wins",
                                "stalled_discovery", "unavailable_threads", "empty_evidence_stalled",
                                "empty_evidence_unavailable", "startup_refusal", "empty_zero_pid",
                                "empty_live_member", "empty_inaccessible", "grace_parent_force",
                                "grace_parent_eof", "grace_descendants_force", "grace_descendants_eof")],
                  "registry": [f"test_adopted_registry_lifetime_macos[{case}]" for case in
                               ("self_managing", "two_grace_windows", "zero_grace_retry",
                                "parent_exits", "natural_finish", "escaped_natural_finish")],
                  "orphan-race": [f"test_interruption_reaps_child_born_before_first_observation_macos[{mode}]"
                                  for mode in ("interrupt", "timeout", "force", "deadline")],
                  "interruption": ["test_wait_for_process_kills_subprocess_on_keyboardinterrupt"],
                  "descendants": ["test_timeout_kill_reaps_setsid_grandchild"],
                  "shutdown": ["test_shutdown_mid_tool_kills_the_command_and_keeps_its_result"],
              },
              "windows": {
                  "ownership": ["test_windows_cleanup_preserves_existing_dispatch"],
                  "lifetime": ["test_windows_retains_native_popen_stdio_and_status"],
              },
          }[marker]
          for label, families in required.items():
              cases = list(ET.parse(folder / f"{label}.xml").getroot().iter("testcase"))
              assert cases, f"{label}: no executed tests"
              for case in cases:
                  assert not any(case.find(tag) is not None for tag in ("failure", "error", "skipped")), (
                      label, case.attrib)
              names = [case.attrib["name"] for case in cases]
              for family in families:
                  assert any(name.startswith(family) for name in names), (label, "missing executed family", family)
              print(f"{marker}: {label}: {len(cases)} executed passes, zero skips")
          PY
